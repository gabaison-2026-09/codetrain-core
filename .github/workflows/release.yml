name: release

# タグ push で migrator イメージを ECR へ push する。
# 「誰が DB を移行するか」を core の migrator イメージ1つに閉じるための唯一の公開経路
# （REPOSITORIES.md §2.1）。認証は codetrain-infra/docs/BOOTSTRAP.md の
# codetrain-core-release ロール（タグ push のみ引受可。本リポジトリの Variables に登録済み:
# AWS_REGION / AWS_ACCOUNT_ID / AWS_ROLE_ECR_PUSH）。

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  migrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: build & push migrator
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/codetrain-migrator
        run: |
          docker build -f Dockerfile.migrate -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
